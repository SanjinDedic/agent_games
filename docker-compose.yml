services:
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      args:
        - RUNTIME_PACKAGES=postgresql18-client
    # Dev: single-worker uvicorn with hot reload. Production uses the Dockerfile CMD (gunicorn).
    # backend/entrypoint.sh runs the one-shot pre-start (init_db + SQL migrations,
    # idempotent, never run from the app lifespan) then execs the server passed to it.
    # docker-compose.test.yml overrides this to run uvicorn directly (no entrypoint) —
    # the test suite owns the test schema.
    command: sh backend/entrypoint.sh uvicorn backend.api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    # Non-secret config only. Mirrors config/deploy.yml env.clear.
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/agent_games
      - VALKEY_URL=redis://valkey:6379/0
      - DB_ENVIRONMENT=${DB_ENVIRONMENT:-production}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      # Load-test gate. Empty by default -> /diagnostics/benchmark-submit is
      # disabled. Set BENCHMARK_TOKEN in the env before `docker compose up` to
      # enable it for a benchmark run. In prod this comes from deploy secrets.
      - BENCHMARK_TOKEN=${BENCHMARK_TOKEN:-}
    # Secrets. .env holds dev defaults (committed); .aws.env is an optional override
    # for devs exercising real S3 (gitignored). Listed second so its values win.
    env_file:
      - path: .env
        required: true
      - path: .aws.env
        required: false
    depends_on:
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./backend:/agent_games/backend
      - ./frontend/public:/agent_games/frontend/public:ro
      # Private tutorial content (gitignored), for backend/scripts/tutorial_sync.py
      - ./tutorial_data:/agent_games/tutorial_data
    mem_limit: 400m
    mem_reservation: 200m
    pids_limit: 50

  # Snippet rate-limit counters + pyodide-fallback telemetry (VALKEY_URL).
  # Ephemeral by design: the counters are short-TTL operational data.
  valkey:
    image: valkey/valkey:latest
    command: valkey-server --save '' --appendonly no --maxmemory 150mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    mem_limit: 200m

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_ASSETS_URL=${VITE_ASSETS_URL:-https://agent-games-assets.s3.ap-southeast-2.amazonaws.com}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 250m

  minio:
    image: minio/minio:latest
    entrypoint: /bin/sh
    command: >
      -c "mkdir -p /data/${AWS_S3_ASSETS_BUCKET:-agent-games-assets}/support/institution
      /data/${AWS_S3_ASSETS_BUCKET:-agent-games-assets}/support/user
      /data/${AWS_S3_BUCKET:-agent-games-backups} &&
      exec minio server /data --console-address ':9001'"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} >/dev/null 2>&1 && mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    mem_limit: 500m
    mem_reservation: 150m

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: agent_games
    env_file:
      - path: .env
        required: true
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_games"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 700m
    mem_reservation: 300m

  # Test runner — not started by `docker compose up`, only via `docker compose run`
  test-runner:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      args:
        - BUILD_ENV=test
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/agent_games
      - VALKEY_URL=redis://valkey:6379/0
      - DB_ENVIRONMENT=test
      - SECRET_KEY=test_secret_key_for_tests
      # Cheap bcrypt for runtime hashing in tests (route-created users, demo
      # users). Precomputed conftest hashes are cost 4 to match.
      - BCRYPT_ROUNDS=4
    depends_on:
      api:
        condition: service_healthy
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/agent_games/backend
      # Private tutorial content + its own tests (run on demand via
      # `... run --rm --no-deps test-runner pytest tutorial_data/tests/`;
      # not part of the public suite/CI — the folder is gitignored)
      - ./tutorial_data:/agent_games/tutorial_data
      # Browser exercise/validation/simulation harnesses, for the CPython
      # parity tests (backend/tests/unit/test_simulation_harness_parity.py,
      # test_simulation_engine_copies.py, and the private Lambda suites'
      # test_exercise_harness_parity.py / test_validation_harness_parity.py
      # — see below)
      - ./frontend/src/pyodide:/agent_games/frontend/src/pyodide:ro
    # backend/fallback_lambda/ and backend/validation_lambda/ are private
    # nested repos (gitignored, like tutorial_data/). Their tests run on
    # demand from a checkout that has them:
    # `... run --rm test-runner pytest backend/fallback_lambda/tests/`
    # `... run --rm test-runner pytest backend/validation_lambda/tests/`
    command: pytest backend/tests/ -v
    scale: 0

volumes:
  postgres_data:
  minio_data:
