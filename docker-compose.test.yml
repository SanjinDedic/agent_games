# Override file for test runs.
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm test-runner
# Points the api at the test database so requests made by tests hit the right data.
services:
  api:
    environment:
      - DB_ENVIRONMENT=test
    # Runs uvicorn directly, deliberately NOT via backend/entrypoint.sh: the test
    # suite owns the test schema (built fresh from the models by conftest), so the
    # api must not run init_db/seed or migrations against agent_games_test.
    command: uvicorn backend.api:app --host 0.0.0.0 --port 8000
  frontend:
    profiles:
      - disabled
